# pzt settings for SdfFontFix (bash syntax, sourced by pzt).
# Fonts load at boot, so the game must start in the test language with the mod already in default.txt.
# Language: TEST_LANG=JP bash ../PZTestHarness/pzt run   (KO JP CH CN TH; default KO)
TEST_LANG="${TEST_LANG:-KO}"
WIDTH=1920
HEIGHT=1080
# fontSize=2 is what "auto" gives at 1080p: the mod must still use the 4x font
OPTIONS="language=$TEST_LANG fontSize=2"
SHOT_UI='getCore():TakeFullScreenshot("pzt_'"$TEST_LANG"'_" .. getTimestamp() .. "_'
TEST_FILES=("tests/SdfFontFix_Test.lua SdfFontFix/42/media/lua/client/")
LOG_GREP='\[SdfFontFix\]'
STEPS=(
  "check Translator.getLanguage():name() == '$TEST_LANG'"
  # no width check: MeasureStringX gives 0 for Hangul even in vanilla KO fonts (UIFont.Small,
  # measured 2026-10-30), so the screenshots below are the test
  "lua ISWorldObjectContextMenu.openFishWindow()"
  "wait 120"
  "lua ${SHOT_UI}fish_info.png\")"
  "wait 30"
  "lua PZAPI.UI.instances.fishWindow.children.body.children.tabPanel:select('guide')"
  "wait 60"
  "lua ${SHOT_UI}fish_guide.png\")"
  "wait 30"
  "lua UIManager.RemoveElement(PZAPI.UI.instances.fishWindow.javaObj)"
  "lua KoFontTest.openPrint('NEWSPAPER', 'KnoxKnews')"
  "wait 60"
  "lua KoFontTest.showText()"
  "wait 30"
  "lua KoFontTest.koreanPanel()"
  "wait 30"
  "lua ${SHOT_UI}print_panel.png\")"
  "wait 30"
)
