# pzt settings for KoreanSdfFont (bash syntax, sourced by pzt).
# Fonts load at boot, so the game must start in Korean with the mod already in default.txt.
WIDTH=1920
HEIGHT=1080
OPTIONS="language=KO"
SHOT_UI='getCore():TakeFullScreenshot("pzt_ko_" .. getTimestamp() .. "_'
TEST_FILES=("tests/KoreanSdfFont_Test.lua KoreanSdfFont/42/media/lua/client/")
LOG_GREP='\[KoreanSdfFont\]'
STEPS=(
  "check Translator.getLanguage():name() == 'KO'"
  # no width check: MeasureStringX gives 0 for Hangul even in vanilla KO fonts (UIFont.Small,
  # measured 2026-10-30), so the screenshots below are the test
  "lua ISWorldObjectContextMenu.openFishWindow()"
  "wait 120"
  "lua ${SHOT_UI}fish_info.png\")"
  "wait 30"
  "lua PZAPI.UI.instances.fishWindow.children.body.children.tabPanel:select('guide')"
  "wait 60"
  "lua ${SHOT_UI}fish_guide.png\")"
  "wait 30"
  "lua UIManager.RemoveElement(PZAPI.UI.instances.fishWindow.javaObj)"
  "lua KoFontTest.openPrint('FLIER', 0)"
  "wait 60"
  "lua KoFontTest.showText()"
  "wait 60"
  "lua ${SHOT_UI}flier_text.png\")"
  "wait 30"
  "lua KoFontTest.openPrint('NEWSPAPER', 'KnoxKnews')"
  "wait 60"
  "lua KoFontTest.showText()"
  "wait 60"
  "lua ${SHOT_UI}knoxnews_text.png\")"
  "wait 30"
  "lua KoFontTest.koreanPanel()"
  "wait 30"
  "lua ${SHOT_UI}korean_panel.png\")"
  "wait 30"
)
